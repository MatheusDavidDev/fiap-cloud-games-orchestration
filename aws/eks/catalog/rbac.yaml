apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fcg-catalog-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["catalog-api"]
    verbs: ["get", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fcg-catalog-deployer
  namespace: default
subjects:
  - kind: Group
    name: fcg-catalog-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: fcg-catalog-deployer
  apiGroup: rbac.authorization.k8s.io


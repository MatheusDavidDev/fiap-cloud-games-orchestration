apiVersion: apps/v1
kind: Deployment

metadata:
  name: payments-api


spec:

  replicas: 1


  selector:

    matchLabels:

      app: payments-api


  template:

    metadata:

      labels:

        app: payments-api


    spec:


      containers:


      - name: payments-api


        image: 043089701673.dkr.ecr.us-east-1.amazonaws.com/fiap-cloud-games-payments:34a2261efe0fb0092a87dea17d15dd40b8d0c830

        imagePullPolicy: IfNotPresent


        ports:


        - containerPort: 8080


        resources:


          limits:

            memory: "512Mi"


          requests:

            memory: "256Mi"



        envFrom:


        - configMapRef:

            name: payments-config


        - secretRef:

            name: payments-secret
